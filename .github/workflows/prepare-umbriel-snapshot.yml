name: Prepare Umbriel snapshot pair

on:
  schedule:
    # Смещено от начала часа, чтобы снизить конкуренцию за runner.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Показать план без branch, commit, artifact и PR"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: umbriel-snapshot-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover and validate an Umbriel pair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish_ready: ${{ steps.ready.outputs.publish_ready }}
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      # Эти digest задают совместимую пару Portage tree и Stage3 tools. Менять
      # их можно только согласованно; затем повторить весь контейнерный prepare
      # по команде из README, включая Manifest, pkgcheck, vercmp и emerge-проверки.
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run focused offline policy tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Discover cachix and the locked portal
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--base-commit "$(git rev-parse HEAD)" \
            --result-json "$RUNNER_TEMP/umbriel-discovery.json" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/watch_umbriel.py "${args[@]}"

      - name: Prepare candidate ebuilds and pair rotation
        id: rotation
        if: steps.watch.outputs.has_candidate == 'true'
        run: |
          args=(--watch-result "$RUNNER_TEMP/umbriel-discovery.json" \
            --result-json "$RUNNER_TEMP/umbriel-preparation.json" \
            --summary "$GITHUB_STEP_SUMMARY")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/prepare_umbriel.py "${args[@]}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare temporary Gentoo overlay metadata
        if: steps.rotation.outputs.prepared == 'true'
        run: |
          # Копируем repo metadata без перезаписи: layout.conf включает thin-manifests,
          # а profiles/repo_name задаёт имя overlay. Container location настраивается ниже отдельно.
          mkdir -p "$RUNNER_TEMP/umbriel-overlay"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/umbriel-overlay/"
          rm -rf "$RUNNER_TEMP/umbriel-overlay/.git"

      - name: Generate Manifests, check versions, pkgcheck and emerge metadata
        if: steps.rotation.outputs.prepared == 'true'
        run: |
          set -eu
          # Portage image предоставляет закреплённое дерево Gentoo как volume,
          # Stage3 выполняет проверки; оба имени должны соответствовать digest выше.
          docker create --name umbriel-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
          cleanup() { docker rm -f umbriel-portage >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm --volumes-from umbriel-portage \
            --mount "type=bind,src=$RUNNER_TEMP/umbriel-overlay,dst=/overlay" \
            --env OVERLAY_UID="$(id -u)" --env OVERLAY_GID="$(id -g)" \
            "$GENTOO_STAGE3_IMAGE" /bin/bash -e -c '
              mkdir -p /etc/portage/repos.conf
              # masters связывает overlay с Gentoo tree из Portage volume;
              # auto-sync=no сохраняет проверяемые версии репозитория и overlay.
              printf "[umbriel-overlay]\nlocation = /overlay\nmasters = gentoo\nauto-sync = no\n" > /etc/portage/repos.conf/umbriel-overlay.conf
              # Gentoo tree приходит из Portage volume, но Stage3 не объявляет его в repos.conf.
              # Этот location нужен pkgcheck и resolver; auto-sync не даёт менять закреплённое дерево.
              printf "[gentoo]\nlocation = /var/db/repos/gentoo\nauto-sync = no\n" > /etc/portage/repos.conf/gentoo.conf
              emerge --oneshot dev-util/pkgcheck
              PYTHONPATH=/overlay/scripts python3 /overlay/scripts/gentoo_validate.py
              chown -R "$OVERLAY_UID:$OVERLAY_GID" /overlay
            '

      - name: Create restricted publication artifact
        id: handoff
        if: steps.rotation.outputs.prepared == 'true'
        run: |
          python3 scripts/umbriel_handoff.py create \
            --repository-root "$RUNNER_TEMP/umbriel-overlay" \
            --destination "$RUNNER_TEMP/umbriel-handoff" \
            --base-commit "$(git rev-parse HEAD)" \
            --prepare-result "$RUNNER_TEMP/umbriel-preparation.json"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload checked artifact
        if: steps.handoff.outputs.created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: umbriel-handoff
          path: ${{ runner.temp }}/umbriel-handoff
          if-no-files-found: error
          retention-days: 2

      - name: Mark artifact ready for publication
        id: ready
        if: steps.handoff.outputs.created == 'true'
        run: echo "publish_ready=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the validated Draft PR
    needs: prepare
    if: needs.prepare.outputs.publish_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download checked artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: umbriel-handoff
          path: ${{ runner.temp }}/umbriel-handoff

      - name: Recheck the single-open-PR rule before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watch_umbriel.py --assert-no-open-pr

      - name: Validate base and apply the allowlisted artifact
        run: |
          python3 scripts/umbriel_handoff.py apply \
            --artifact "$RUNNER_TEMP/umbriel-handoff" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-base "$(cat "$RUNNER_TEMP/umbriel-handoff/handoff.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base_commit"])')" \
            --actual-base "$(git rev-parse HEAD)"

      - name: Verify only pair, package and documentation files changed
        run: |
          set -eu
          git diff --check
          python3 scripts/umbriel_handoff.py verify-diff \
            --artifact "$RUNNER_TEMP/umbriel-handoff" \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Create commit and deterministic branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umbriel_sha=$(python3 -c "import json; print(json.load(open('automation/accepted-pairs.json'))['current']['umbriel']['sha'])")
          portal_sha=$(python3 -c "import json; print(json.load(open('automation/accepted-pairs.json'))['current']['portal']['sha'])")
          branch="automation/umbriel-${umbriel_sha:0:12}-${portal_sha:0:12}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md automation/accepted-pairs.json gui-wm/umbriel gui-libs/xdg-desktop-portal-umbriel
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "update: Umbriel snapshot pair"
          original_remote=$(git remote get-url origin)
          restore_remote() { git remote set-url origin "$original_remote"; }
          trap restore_remote EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing=$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')
          if [ -n "$existing" ]; then
            git fetch origin "refs/heads/$branch"
            remote_commit=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$remote_commit^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ] \
              || [ "$(git rev-parse "$remote_commit^")" != "$(git rev-parse 'HEAD^')" ]; then
              echo "Automation branch exists with a different tree or base commit." >&2
              exit 1
            fi
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the Draft Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          python3 scripts/umbriel_handoff.py write-pr \
            --artifact "$RUNNER_TEMP/umbriel-handoff" \
            --request "$RUNNER_TEMP/umbriel-pull-request.json" \
            --branch "$BRANCH"
          curl --fail-with-body --silent --show-error \
            --request POST --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/umbriel-pull-request.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls"
